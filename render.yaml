services:
  # ── GlobeTrotter Backend (FastAPI) ──
  - type: web
    name: globetrotter-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 50
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DEBUG
        value: "false"

  # ── GlobeTrotter Frontend (Next.js) ──
  - type: web
    name: globetrotter-frontend
    runtime: node
    rootDir: frontend/globe-trotter
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: globetrotter-backend
          property: host
